[workspace]
resolver = "3"
members = [ "app", "jieyusha", "model", "tools/bash", "tools/file_read_tool", "tools/automation", "tuo"]

[workspace.dependencies]
log = "0.4"
app = { path = "app" }
jieyusha = { path = "jieyusha" }
tracing = "0.1.41"
async-trait = "0.1"
uuid = { version = "1.18", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

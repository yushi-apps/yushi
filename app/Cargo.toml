[package]
name = "app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "yushi"
path = "src/main.rs"

[features]
model-smallthinker = []

[dependencies]
toml = "0.9.8"
actix-web = "4"
tokio = { version = "1.0", features = ["rt-multi-thread", "time", "macros"] }
futures = "0.3"
tracing-subscriber = "0.3"
bash = { path = "../tools/bash" }
reedline = "0.45"

log.workspace = true
tracing.workspace = true
uuid.workspace = true
jieyusha.workspace = true

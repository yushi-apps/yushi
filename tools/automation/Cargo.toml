[package]
name = "automation"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
quick-xml = { version = "0.31", features = ["serialize"] }
uuid = { version = "1", features = ["v4"] }
croner = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1"

# 项目内依赖
jieyusha = { path = "../../jieyusha" }
tuo = { path = "../../tuo" }
# model = { path = "../../model" }

async-stream = "0.3"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
